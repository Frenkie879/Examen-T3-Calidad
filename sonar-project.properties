# Configuración para SonarQube / SonarCloud (sonar-scanner)
sonar.projectKey=labtrack
sonar.projectName=LabTrack - Sistema de Gestión de Laboratorios
sonar.projectVersion=2.0.0
sonar.sources=src
sonar.tests=tests
sonar.exclusions=**/node_modules/**,reports/**,legacy/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=reports/sonar/eslint-report.json
